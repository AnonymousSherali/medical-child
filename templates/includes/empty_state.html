{% comment %}
Bo'sh holat. Parametrlar: icon, title, text, action_url, action_label
{% include 'includes/empty_state.html' with icon='fa-baby' title='...' text='...' %}
{% endcomment %}
<div class="nm-empty">
    <div class="nm-empty-icon"><i class="fa-solid {{ icon|default:'fa-inbox' }}"></i></div>
    <div class="nm-empty-title">{{ title }}</div>
    {% if text %}<p class="mb-3 small">{{ text }}</p>{% endif %}
    {% if action_url %}
    <a href="{{ action_url }}" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus me-1"></i>{{ action_label }}</a>
    {% endif %}
</div>
